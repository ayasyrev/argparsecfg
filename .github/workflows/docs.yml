name: ci
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install mkdocs-material
      - run: uv pip install pymdown-extensions
      - run: mkdocs gh-deploy --force
